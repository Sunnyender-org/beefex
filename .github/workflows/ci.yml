name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-macos:
    # The public workflow runs checks only; it does not deploy, sign, notarize,
    # or publish binaries.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # tauri-build validates the target-specific Beefex OCR sidecar before Rust tests.
      - name: Build Swift sidecar
        run: npm run build:swift

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  quality-windows:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      - name: Build Windows sidecar stub
        run: npm run build:swift

      - name: Build and verify bundled Pi
        shell: pwsh
        run: |
          npm run build:pi-runtime
          $version = & .\src-tauri\resources\pi\bin\pi.exe --version
          if ($version.Trim() -ne '0.84.1') {
            throw "unexpected bundled Pi version: $version"
          }

      - name: Rust tests
        shell: pwsh
        run: ./scripts/win-cargo-test.ps1

      - name: Build unsigned NSIS acceptance package
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target-ci-release
        run: |
          npm run tauri -- build --bundles nsis --no-sign --ci
          $currentShell = Get-ChildItem .\dist\assets\*.js |
            Select-String -Pattern 'PI WORKBENCH' -SimpleMatch -Quiet
          if (-not $currentShell) {
            throw 'built frontend is missing the current Beefex PI WORKBENCH marker'
          }

      - name: Retain unsigned NSIS acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: beefex-windows-x64-unsigned-${{ github.sha }}
          path: src-tauri/target-ci-release/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
