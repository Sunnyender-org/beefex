name: Clean macOS bundle smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-macos-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-launch:
    # macos-15 is the GitHub-hosted Apple Silicon image. This job builds and
    # launches an unsigned app ephemerally; it uploads and publishes nothing.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean runner architecture
        run: test "$(uname -m)" = arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned app bundle
        run: npm run tauri -- build --bundles app --no-sign --ci

      - name: Verify and launch from isolated home
        run: bash scripts/verify-clean-macos-bundle.sh
